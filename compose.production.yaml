name: ${COMPOSE_PROJECT_NAME:-cheongnyeon-alimi-production}

x-postgres-image: &postgres-image postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
x-redis-image: &redis-image redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
x-backend-image: &backend-image ${BACKEND_IMAGE:?Set a digest-qualified BACKEND_IMAGE}
x-database-url: &database-url postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:?Set POSTGRES_DB}
x-backend-environment: &backend-environment
  ENVIRONMENT: production
  DATABASE_URL: *database-url
  SECRET_KEY: ${BACKEND_SECRET_KEY:?Set BACKEND_SECRET_KEY}
  CELERY_BROKER_URL: redis://redis:6379/0
  COLLECTION_QUEUE_NAME: collection

services:
  database:
    image: *postgres-image
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - production-db:/var/lib/postgresql
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt: [no-new-privileges:true]

  redis:
    image: *redis-image
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec]
    volumes:
      - production-redis:/data
    networks: [queue]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    security_opt: [no-new-privileges:true]

  migrate:
    image: *backend-image
    pull_policy: missing
    depends_on:
      database: {condition: service_healthy}
    environment: *backend-environment
    command:
      - sh
      - -ec
      - >-
        alembic upgrade head &&
        python -m app.cli.import_regions
    networks: [database]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    restart: "no"
    security_opt: [no-new-privileges:true]

  public-dataset-bootstrap:
    image: *backend-image
    pull_policy: missing
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment: *backend-environment
    volumes:
      - type: bind
        source: ${PUBLIC_DATASET_DIR:?Set an absolute verified dataset directory}
        target: /bootstrap
        read_only: true
    command:
      - sh
      - -ec
      - >-
        python /app/scripts/build_public_bootstrap_dataset.py
        --verify-manifest /bootstrap/manifest.json &&
        python -m app.cli.import_public_dataset
        --manifest /bootstrap/manifest.json
    networks: [database]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    restart: "no"
    security_opt: [no-new-privileges:true]

  backend:
    image: *backend-image
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      public-dataset-bootstrap: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    environment:
      <<: *backend-environment
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS as a JSON array}
      ADMIN_PIN_HASH: ${ADMIN_PIN_HASH:?Set ADMIN_PIN_HASH}
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET:?Set ADMIN_TOKEN_SECRET}
    volumes:
      - production-logs:/app/backend/logs
      - production-runtime:/app/backend/runtime
    networks: [app, database, queue]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt: [no-new-privileges:true]

  collection-worker:
    image: *backend-image
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      public-dataset-bootstrap: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    environment:
      <<: *backend-environment
      COLLECTION_TASK_MAX_RETRIES: ${COLLECTION_TASK_MAX_RETRIES:-5}
      COLLECTION_TASK_RETRY_BACKOFF_MAX_SECONDS: ${COLLECTION_TASK_RETRY_BACKOFF_MAX_SECONDS:-300}
      COLLECTION_TASK_RATE_LIMIT: ${COLLECTION_TASK_RATE_LIMIT:-6/m}
      COLLECTION_SCHEDULE_ENABLED: ${COLLECTION_SCHEDULE_ENABLED:-false}
      COLLECTION_SCHEDULE_SOURCE_ID: ${COLLECTION_SCHEDULE_SOURCE_ID:-youthcenter-api}
      COLLECTION_SCHEDULE_REQUESTED_COUNT: ${COLLECTION_SCHEDULE_REQUESTED_COUNT:-100}
      COLLECTION_SNAPSHOT_REQUEST_BUDGET: ${COLLECTION_SNAPSHOT_REQUEST_BUDGET:-12}
      YOUTHCENTER_API_KEY: ${YOUTHCENTER_API_KEY:-}
      BOKJIRO_API_KEY: ${BOKJIRO_API_KEY:-}
    command: [celery, -A, app.worker.celery_app:celery_app, worker, --loglevel=INFO, --queues=collection, "--concurrency=${COLLECTION_WORKER_CONCURRENCY:-2}"]
    volumes:
      - production-logs:/app/backend/logs
      - production-runtime:/app/backend/runtime
    networks: [database, queue, collector-egress]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    healthcheck:
      test: [CMD-SHELL, "celery -A app.worker.celery_app:celery_app inspect ping --destination celery@$${HOSTNAME} --timeout 5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    security_opt: [no-new-privileges:true]

  collection-scheduler:
    image: *backend-image
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      redis: {condition: service_healthy}
      collection-worker: {condition: service_healthy}
    environment:
      <<: *backend-environment
      COLLECTION_SCHEDULE_ENABLED: ${COLLECTION_SCHEDULE_ENABLED:-false}
      COLLECTION_SCHEDULE_SOURCE_ID: ${COLLECTION_SCHEDULE_SOURCE_ID:-youthcenter-api}
      COLLECTION_SCHEDULE_REQUESTED_COUNT: ${COLLECTION_SCHEDULE_REQUESTED_COUNT:-100}
      COLLECTION_SCHEDULE_COMPLETE_SNAPSHOT: ${COLLECTION_SCHEDULE_COMPLETE_SNAPSHOT:-false}
      COLLECTION_SNAPSHOT_REQUEST_BUDGET: ${COLLECTION_SNAPSHOT_REQUEST_BUDGET:-12}
      COLLECTION_SCHEDULE_CRON_HOUR: ${COLLECTION_SCHEDULE_CRON_HOUR:-3}
      COLLECTION_SCHEDULE_CRON_MINUTE: ${COLLECTION_SCHEDULE_CRON_MINUTE:-0}
    command: [celery, -A, app.worker.celery_app:celery_app, beat, --loglevel=INFO, --schedule=/tmp/celerybeat-schedule]
    networks: [database, queue]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    healthcheck:
      test: [CMD-SHELL, "kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt: [no-new-privileges:true]

  frontend:
    image: ${FRONTEND_IMAGE:?Set a digest-qualified FRONTEND_IMAGE}
    pull_policy: missing
    restart: unless-stopped
    environment: {PORT: "3000"}
    networks: [app]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    security_opt: [no-new-privileges:true]

  nginx:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    user: "101:101"
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_healthy}
    ports:
      - 127.0.0.1:${NGINX_HOST_PORT:-8080}:8080
    volumes:
      - type: bind
        source: ./deployment/nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
    networks: [app]
    read_only: true
    tmpfs:
      - "/tmp:size=32m,mode=1777"
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8080/health | grep -q '\"status\":\"ok\"'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    security_opt: [no-new-privileges:true]

volumes:
  production-db:
  production-redis:
  production-logs:
  production-runtime:

networks:
  app:
  database: {internal: true}
  queue: {internal: true}
  collector-egress:
