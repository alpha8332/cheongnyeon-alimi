name: Public dataset release

on:
  workflow_dispatch:
    inputs:
      dataset_version:
        description: Optional public-bootstrap-YYYYMMDD-HEX override
        required: false
        type: string
  schedule:
    - cron: "17 18 * * *"

concurrency:
  group: public-dataset-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production-data
    services:
      postgres:
        image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
        env:
          POSTGRES_DB: cheongnyeon_alimi_production_data
          POSTGRES_USER: collector
          POSTGRES_PASSWORD: ephemeral-collector-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U collector -d cheongnyeon_alimi_production_data"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://collector:ephemeral-collector-password@127.0.0.1:5432/cheongnyeon_alimi_production_data
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      COLLECTION_QUEUE_NAME: collection
      COLLECTION_SNAPSHOT_REQUEST_BUDGET: "12"
      BOKJIRO_API_KEY: ${{ secrets.BOKJIRO_API_KEY }}
      YOUTHCENTER_API_KEY: ${{ secrets.YOUTHCENTER_API_KEY }}
      PYTHONPATH: backend:.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install --require-hashes --no-deps -r backend/requirements.lock
      - name: Refuse a missing source secret
        shell: bash
        run: |
          test -n "$BOKJIRO_API_KEY"
          test -n "$YOUTHCENTER_API_KEY"
      - name: Migrate the ephemeral collection database
        working-directory: backend
        run: alembic upgrade head
      - name: Import the locked administrative-region reference
        run: python -m app.cli.import_regions
      - name: Start the isolated collection worker
        shell: bash
        run: |
          nohup python -m celery -A app.worker.celery_app worker \
            --loglevel=INFO --queues=collection --concurrency=1 \
            --hostname=production-data@%h \
            >"$RUNNER_TEMP/collection-worker.log" 2>&1 &
          worker_pid=$!
          for attempt in {1..30}; do
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              echo "collection worker exited before becoming ready" >&2
              cat "$RUNNER_TEMP/collection-worker.log" >&2
              exit 1
            fi
            if grep -qE ' ready\.$' "$RUNNER_TEMP/collection-worker.log"; then
              exit 0
            fi
            echo "waiting for collection worker ($attempt/30)"
            sleep 2
          done
          echo "collection worker did not become ready" >&2
          cat "$RUNNER_TEMP/collection-worker.log" >&2
          exit 1
      - name: Queue and await all complete public Source snapshots
        id: collection
        shell: bash
        run: |
          for source_id in \
            bokjiro-central-welfare-api \
            youthcenter-api \
            data-go-kr-incheon-youth-programs; do
            if ! collection_json=$(python scripts/run_complete_collection.py \
                --source-id "$source_id" \
                --page-size 500 --timeout-seconds 1200); then
              cat "$RUNNER_TEMP/collection-worker.log" >&2
              exit 1
            fi
            echo "$collection_json"
            run_id=$(python -c 'import json,sys; print(json.load(sys.stdin)["collection_run_id"])' \
              <<<"$collection_json")
            if [ "$source_id" = "bokjiro-central-welfare-api" ]; then
              echo "bokjiro_run_id=$run_id" >> "$GITHUB_OUTPUT"
            elif [ "$source_id" = "youthcenter-api" ]; then
              echo "youthcenter_run_id=$run_id" >> "$GITHUB_OUTPUT"
            else
              echo "incheon_run_id=$run_id" >> "$GITHUB_OUTPUT"
            fi
          done
      - name: Resolve immutable dataset version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.dataset_version }}
        run: |
          if [ -n "$REQUESTED_VERSION" ]; then
            version="$REQUESTED_VERSION"
          else
            run_hex=$(printf '%x' "$GITHUB_RUN_ID")
            version="public-bootstrap-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}${run_hex:0:7}"
          fi
          if ! [[ "$version" =~ ^public-bootstrap-[0-9]{8}-[0-9a-f]{7,40}$ ]]; then
            echo "invalid dataset version" >&2
            exit 1
          fi
          echo "dataset_version=$version" >> "$GITHUB_OUTPUT"
      - name: Refuse an existing immutable release
        env:
          DATASET_VERSION: ${{ steps.version.outputs.dataset_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "dataset-${DATASET_VERSION}" >/dev/null 2>&1; then
            echo "immutable dataset release already exists" >&2
            exit 1
          fi
      - name: Read previous version
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release previous
          if gh release download dataset-latest -p public-dataset-pointer.json -D previous; then
            echo "version=$(python -c 'import json; print(json.load(open("previous/public-dataset-pointer.json"))["dataset_version"])')" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi
      - name: Gate and build immutable dataset
        shell: bash
        env:
          DATASET_VERSION: ${{ steps.version.outputs.dataset_version }}
          BOKJIRO_COLLECTION_RUN_ID: ${{ steps.collection.outputs.bokjiro_run_id }}
          YOUTHCENTER_COLLECTION_RUN_ID: ${{ steps.collection.outputs.youthcenter_run_id }}
          INCHEON_COLLECTION_RUN_ID: ${{ steps.collection.outputs.incheon_run_id }}
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
        run: |
          previous_args=()
          if [ -n "$PREVIOUS_VERSION" ]; then
            previous_args+=(--previous-dataset-version "$PREVIOUS_VERSION")
          fi
          python scripts/promote_public_dataset.py \
            --database-url "$DATABASE_URL" \
            --collection-run-id "$BOKJIRO_COLLECTION_RUN_ID" \
            --collection-run-id "$YOUTHCENTER_COLLECTION_RUN_ID" \
            --collection-run-id "$INCHEON_COLLECTION_RUN_ID" \
            --output-dir release \
            --dataset-version "$DATASET_VERSION" \
            --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --git-sha "$GITHUB_SHA" \
            "${previous_args[@]}" \
            --manifest-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/dataset-${DATASET_VERSION}/${DATASET_VERSION}.manifest.json"
      - name: Install and activate the staged public dataset
        shell: bash
        env:
          DATASET_VERSION: ${{ steps.version.outputs.dataset_version }}
        run: |
          python -m app.cli.import_public_dataset \
            --manifest "release/${DATASET_VERSION}.manifest.json"
      - name: Refuse user-visible public dataset parity gaps
        shell: bash
        run: |
          python scripts/audit_public_dataset_parity.py \
            --database-url "$DATABASE_URL" \
            --as-of "$(TZ=Asia/Seoul date +%F)" \
            --output "$RUNNER_TEMP/public-dataset-parity.json" \
            --require-parity
      - name: Publish and re-verify immutable assets
        shell: bash
        env:
          DATASET_VERSION: ${{ steps.version.outputs.dataset_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "dataset-${DATASET_VERSION}" \
            "release/cheongnyeon-alimi-${DATASET_VERSION}.json" \
            "release/${DATASET_VERSION}.manifest.json" \
            --title "Public dataset ${DATASET_VERSION}" --notes "Verified normalized public dataset."
          mkdir uploaded
          gh release download "dataset-${DATASET_VERSION}" -D uploaded
          python scripts/build_public_bootstrap_dataset.py \
            --verify-manifest "uploaded/${DATASET_VERSION}.manifest.json"
      - name: Advance latest pointer only after uploaded verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dataset-latest >/dev/null 2>&1 || \
            gh release create dataset-latest --title "Latest public dataset" --notes "Mutable verified pointer only."
          gh release upload dataset-latest release/public-dataset-pointer.json --clobber
