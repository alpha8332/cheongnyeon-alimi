name: Public dataset release

on:
  workflow_dispatch:
    inputs:
      dataset_version:
        description: public-bootstrap-YYYYMMDD-GITSHA
        required: true
        type: string
      collection_run_ids:
        description: Space-separated latest successful run UUIDs, one per public source
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote:
    runs-on: [self-hosted, linux, x64, production-data]
    environment: production-data
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATASET_DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
      DATASET_VERSION: ${{ inputs.dataset_version }}
      COLLECTION_RUN_IDS: ${{ inputs.collection_run_ids }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install --require-hashes --no-deps -r backend/requirements.lock
      - name: Refuse an existing immutable release
        run: |
          if gh release view "dataset-${DATASET_VERSION}" >/dev/null 2>&1; then
            echo "immutable dataset release already exists" >&2
            exit 1
          fi
      - name: Read previous version
        id: previous
        shell: bash
        run: |
          mkdir -p release previous
          if gh release download dataset-latest -p public-dataset-pointer.json -D previous; then
            echo "version=$(python -c 'import json; print(json.load(open("previous/public-dataset-pointer.json"))["dataset_version"])')" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi
      - name: Gate and build immutable dataset
        shell: bash
        run: |
          run_args=()
          for run_id in $COLLECTION_RUN_IDS; do
            run_args+=(--collection-run-id "$run_id")
          done
          previous_args=()
          if [ -n "${{ steps.previous.outputs.version }}" ]; then
            previous_args+=(--previous-dataset-version "${{ steps.previous.outputs.version }}")
          fi
          python scripts/promote_public_dataset.py \
            --database-url "$DATABASE_URL" \
            "${run_args[@]}" \
            --output-dir release \
            --dataset-version "$DATASET_VERSION" \
            --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --git-sha "$GITHUB_SHA" \
            "${previous_args[@]}" \
            --manifest-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/dataset-${DATASET_VERSION}/${DATASET_VERSION}.manifest.json"
      - name: Publish and re-verify immutable assets
        shell: bash
        run: |
          gh release create "dataset-${DATASET_VERSION}" \
            "release/cheongnyeon-alimi-${DATASET_VERSION}.json" \
            "release/${DATASET_VERSION}.manifest.json" \
            --title "Public dataset ${DATASET_VERSION}" --notes "Verified normalized public dataset."
          mkdir uploaded
          gh release download "dataset-${DATASET_VERSION}" -D uploaded
          python scripts/build_public_bootstrap_dataset.py \
            --verify-manifest "uploaded/${DATASET_VERSION}.manifest.json"
      - name: Advance latest pointer only after uploaded verification
        shell: bash
        run: |
          gh release view dataset-latest >/dev/null 2>&1 || \
            gh release create dataset-latest --title "Latest public dataset" --notes "Mutable verified pointer only."
          gh release upload dataset-latest release/public-dataset-pointer.json --clobber
