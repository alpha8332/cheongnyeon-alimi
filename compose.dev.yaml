services:
  database:
    ports:
      - 127.0.0.1:${POSTGRES_DEV_HOST_PORT:-55432}:5432

  backend:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/app:/app/backend/app
      - ./backend/alembic:/app/backend/alembic
      - ./backend/alembic.ini:/app/backend/alembic.ini:ro
      - ./collectors:/app/collectors
      - ./data/reference:/app/data/reference:ro
      - ./data/schema:/app/data/schema:ro
      - ./data/seeds:/app/data/seeds:ro
      - backend-logs:/app/backend/logs
      - backend-runtime:/app/backend/runtime

  frontend:
    build:
      target: build
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set the browser-visible Backend URL in .env.compose}
    volumes:
      - ./frontend:/workspace/frontend
      - ./data/seeds:/workspace/data/seeds:ro
      - frontend-node-modules:/workspace/frontend/node_modules

volumes:
  frontend-node-modules:

